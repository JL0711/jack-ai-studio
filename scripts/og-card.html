<!doctype html>
<!--
  The link-preview image (public/og.png, 1200×630) shown when the site is shared
  on Upwork, LinkedIn, iMessage, Slack and so on. Edit this file, then regenerate:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --force-device-scale-factor=1 --screenshot=public/og.png \
    "file://$PWD/scripts/og-card.html"

  (run from the repo root after `npm install`, which provides the Hubot Sans font file)
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Hubot Sans';
        src: url('../node_modules/@fontsource-variable/hubot-sans/files/hubot-sans-latin-wdth-normal.woff2') format('woff2');
        font-weight: 200 900;
        font-stretch: 75% 125%;
      }
      @font-face {
        font-family: 'Fusion Pixel';
        src: url('../fonts/fusion-pixel/fusion-pixel-12px-proportional-zh_hans.otf.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0b0c0e;
        color: #ece9e2;
        font-family: 'Hubot Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#23272e 1.3px, transparent 1.7px);
        background-size: 24px 24px;
        background-position: 12px 12px;
        -webkit-mask-image: linear-gradient(to bottom, #000 40%, transparent 95%);
      }
      .frame {
        position: absolute;
        inset: 0;
        padding: 58px 68px 56px;
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 720;
        font-stretch: 125%;
        font-size: 24px;
        letter-spacing: 0.08em;
      }
      .brand i {
        font-style: normal;
        color: #6a6d74;
        font-weight: 400;
        margin: 0 0.14em;
      }
      .led {
        width: 14px;
        height: 14px;
        background: #ffb224;
        box-shadow: 0 0 18px rgba(255, 178, 36, 0.7);
      }
      .pixel {
        font-family: 'Fusion Pixel', monospace;
        font-size: 24px;
        line-height: 24px;
        -webkit-font-smoothing: none;
      }
      .url {
        color: #6a6d74;
      }
      .head {
        margin: auto 0 0;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-weight: 600;
        font-size: 82px;
        line-height: 1.12;
        letter-spacing: -0.01em;
      }
      .head .ai {
        font-family: 'Hubot Sans', sans-serif;
        font-weight: 720;
        font-stretch: 118%;
      }
      .head .dim {
        color: #6a6d74;
      }
      .en {
        margin: 22px 0 0;
        font-size: 29px;
        font-weight: 450;
        color: #9c9ea3;
        letter-spacing: -0.005em;
      }
      .specs {
        display: flex;
        gap: 14px;
        margin-top: 40px;
      }
      .spec {
        padding: 11px 14px;
        border: 1px solid #353a43;
        background: #0f1114;
        color: #ece9e2;
      }
      .spec b {
        font-weight: inherit;
        color: #ffb224;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="top">
        <div class="brand"><span class="led"></span><span>JACK<i>/</i>AI<i>/</i>STUDIO</span></div>
        <span class="pixel url">jl0711.github.io/jack-ai-studio</span>
      </div>
      <div class="head">
        <div>数据不出门的 <span class="ai">AI</span>，</div>
        <div class="dim">和真正上线的软件。</div>
      </div>
      <p class="en">AI that keeps your data in-house, and software that actually ships.</p>
      <div class="specs pixel">
        <span class="spec"><b>■</b> 本地模型 qwen3:14b · bge-m3</span>
        <span class="spec">RTX 5070 Ti · 16 GB</span>
        <span class="spec">中文 · English</span>
      </div>
    </div>
  </body>
</html>
