<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Jack AI Studio</title>
    <script>
      // GitHub Pages serves this file for any address it has no file for, such as
      // /jack-ai-studio/showcase typed without the "#". The site's pages live after
      // the "#" (HashRouter), so send the visitor to the same page there:
      // /jack-ai-studio/showcase?lang=en  ->  /jack-ai-studio/?lang=en#/showcase
      (function () {
        var loc = window.location;
        var segments = loc.pathname.split('/');
        // On <name>.github.io the first segment is the repository; on a custom domain there is none.
        var base = /\.github\.io$/.test(loc.hostname) && segments[1] ? '/' + segments[1] + '/' : '/';
        var rest = loc.pathname.slice(base.length).replace(/\/+$/, '').replace(/^index\.html$/, '');
        var target = base + loc.search + (rest ? '#/' + rest : loc.hash);
        loc.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0c0e;
        color: #9c9ea3;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      a {
        color: #ffb224;
      }
    </style>
  </head>
  <body>
    <p>正在打开… Opening… <a href="/jack-ai-studio/">Jack AI Studio</a></p>
  </body>
</html>
