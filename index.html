<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Jack AI Studio · Jack 本地 AI 工作室：AI 工具、本地私有化 AI 部署、Web 应用与自动化，中英双语沟通。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Jack AI Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('studio-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript. 本网站需要启用 JavaScript。</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
