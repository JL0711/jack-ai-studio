<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Jack AI Studio · Jack 本地 AI 工作室：本地私有化 AI、带出处的文档问答、Web 应用与自动化，中英双语沟通。Private local AI, document Q&A with sources, web apps and automation, in English or Chinese." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Jack AI Studio</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Dark is the default.
      try {
        var t = localStorage.getItem('studio-theme-v2');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (t === 'auto') document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript. 本网站需要启用 JavaScript。</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
